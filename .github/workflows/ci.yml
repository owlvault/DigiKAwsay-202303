name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: digikawsay_app
          POSTGRES_PASSWORD: local_password_123
          POSTGRES_DB: digikawsay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digikawsay_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          VERTEX_AI_DISABLED: "true"
          GCP_PROJECT_ID: ci-project
          DATABASE_URL: postgresql://digikawsay_app:local_password_123@localhost:5432/digikawsay
        run: pytest tests/unit/ -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint with ruff
        run: ruff check src/ tests/ --select E,F,W --ignore E501
